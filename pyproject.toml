[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-rain-guard"
version = "0.1.0"
description = "Chat with your Teslas through any OpenAI client — an OpenAI-compatible API server (chat completions, models, embeddings) over the official Tesla Fleet API, with a pluggable LLM backend and full offline rules engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "openai-compatible", "llm", "ai", "chat", "ollama", "voice-control", "home-automation", "ev", "model-3", "model-y"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.scripts]
train = "tesla_rain_guard.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-rain-guard"
Issues = "https://github.com/rtmalikian/tesla-rain-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
